# Despliegue en un VPS que ya tiene Traefik (p. ej. la plantilla n8n de Hostinger).
# Ajusta MCP_DOMAIN, la red de Traefik y el certresolver a los de tu servidor:
#   docker network ls                    -> red donde está Traefik
#   docker inspect <traefik> | grep -i certresolver
services:
  supabase-mcp:
    build: .
    container_name: supabase-mcp
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./projects.json:/app/config/projects.json:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.supabase-mcp.rule=Host(`${MCP_DOMAIN}`)
      - traefik.http.routers.supabase-mcp.entrypoints=websecure
      - traefik.http.routers.supabase-mcp.tls=true
      - traefik.http.routers.supabase-mcp.tls.certresolver=${TRAEFIK_CERTRESOLVER:-mytlschallenge}
      - traefik.http.services.supabase-mcp.loadbalancer.server.port=3000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-root_default}
